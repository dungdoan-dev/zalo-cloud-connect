<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cấu hình ZCC</title>
<style>
  :root{font-family:Inter,system-ui,sans-serif;color:#edf5ff;background:#07111f}*{box-sizing:border-box}body{max-width:1120px;margin:34px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}h1,h2,h3{margin:0}p,small{color:#9fb4ce}.card{margin:16px 0;padding:20px;border:1px solid #29415f;border-radius:14px;background:#0d1b2d}.oa,.extension{position:relative;margin-top:14px;padding:16px;border:1px solid #2b4665;border-radius:11px;background:#0a1728}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid.two{grid-template-columns:repeat(2,1fr)}label{display:block;color:#b8cbe0;font-size:12px}input,select,button{width:100%;margin-top:5px;padding:10px;border:1px solid #385471;border-radius:8px;background:#071321;color:#fff;font:inherit}button{width:auto;border:0;background:#1472ed;font-weight:700;cursor:pointer}.delete{position:absolute;right:12px;top:12px;background:#8d3041}.secondary{background:#263b58}.add{margin-top:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#status{min-height:22px;margin:16px 0;padding:10px;border-radius:8px;background:#17283a}.ok{background:#103c31!important}@media(max-width:760px){.grid,.grid.two{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>Cấu hình Zalo OA & Máy nhánh</h1><p>Mỗi máy nhánh thuộc một OA. Token và mật khẩu extension không hiển thị lại sau khi lưu.</p></div><a href="/" style="color:#8dbdff">← Call Center</a></header>
<section class="card"><h2>Xác thực quản trị</h2><div class="grid two"><label>Mật khẩu quản trị<input id="admin" type="password" autocomplete="current-password"></label><div class="row" style="align-self:end"><button id="load" type="button">Tải cấu hình</button></div></div></section>
<main id="editor" hidden>
  <section class="card"><div class="row"><h2>Zalo Official Account</h2><button id="add-oa" class="secondary" type="button">+ Thêm OA</button></div><div id="accounts"></div></section>
  <section class="card"><div class="row"><h2>Máy nhánh</h2><button id="add-extension" class="secondary" type="button">+ Thêm máy nhánh</button></div><div id="extensions"></div></section>
  <div class="row"><button id="save" type="button">Lưu và áp dụng FreeSWITCH</button><small>FreeSWITCH reload XML tự động sau khi lưu.</small></div>
</main><div id="status">Nhập mật khẩu quản trị rồi tải cấu hình.</div>
<template id="oa-template"><article class="oa"><button class="delete remove-oa" type="button">Xóa OA</button><div class="grid"><label>Mã cấu hình OA<input data-field="id" placeholder="vd: dental"></label><label>Tên OA<input data-field="name" placeholder="OA Nha khoa"></label><label>Access Token<input data-field="accessToken" type="password" placeholder="Để trống để giữ token cũ"></label><label>App ID<input data-field="appId" inputmode="numeric"></label><label>OA ID<input data-field="oaId" inputmode="numeric"></label><label>OA ID + mã phân luồng<input data-field="inboundId" inputmode="numeric"></label></div></article></template>
<template id="extension-template"><article class="extension"><button class="delete remove-extension" type="button">Xóa máy nhánh</button><div class="grid"><label>Extension<input data-field="id" inputmode="numeric" placeholder="1002"></label><label>Tên nhân viên/máy<input data-field="name" placeholder="Lễ tân 2"></label><label>Thuộc OA<select data-field="accountId"></select></label><label>Mật khẩu SIP<input data-field="password" type="password" autocomplete="new-password" placeholder="Để trống để giữ mật khẩu cũ"></label></div></article></template>
<script>
const $=id=>document.getElementById(id);let state={accounts:[],extensions:[]};
const status=(text,ok=false)=>{const el=$('status');el.textContent=text;el.className=ok?'ok':''};
const clone=(id)=>$(id).content.firstElementChild.cloneNode(true);
function fields(element){return Object.fromEntries([...element.querySelectorAll('[data-field]')].map(input=>[input.dataset.field,input.value.trim()]));}
function appendAccount(account={}){const el=clone('oa-template');Object.entries(account).forEach(([key,value])=>{const input=el.querySelector(`[data-field="${key}"]`);if(input)input.value=value||''});el.querySelector('.remove-oa').onclick=()=>{el.remove();renderExtensionOptions();};$('accounts').append(el);}
function appendExtension(extension={}){const el=clone('extension-template');for(const [key,value] of Object.entries(extension)){const input=el.querySelector(`[data-field="${key}"]`);if(input&&key!=='accountId')input.value=value||'';}$('extensions').append(el);renderExtensionOptions();const select=el.querySelector('[data-field="accountId"]');select.value=extension.accountId||select.value;el.querySelector('.remove-extension').onclick=()=>el.remove();}
function renderExtensionOptions(){const accounts=[...document.querySelectorAll('.oa')].map(fields);document.querySelectorAll('.extension select[data-field="accountId"]').forEach(select=>{const selected=select.value;select.innerHTML=accounts.map(a=>`<option value="${a.id}">${a.name||a.id||'OA chưa đặt tên'}</option>`).join('');select.value=selected||accounts[0]?.id||'';});}
function readState(){return{accounts:[...document.querySelectorAll('.oa')].map(fields),extensions:[...document.querySelectorAll('.extension')].map(fields)}}
async function load(){const response=await fetch('/api/settings',{headers:{'x-config-password':$('admin').value}});const data=await response.json();if(!response.ok)throw Error(data.error||'Không thể tải cấu hình');state=data;$('accounts').innerHTML='';$('extensions').innerHTML='';data.accounts.forEach(appendAccount);data.extensions.forEach(appendExtension);$('editor').hidden=false;status('Đã tải cấu hình.');}
$('load').onclick=()=>load().catch(error=>status(error.message));
$('add-oa').onclick=()=>appendAccount({id:`oa-${Date.now()}`,name:'OA mới'});
$('add-extension').onclick=()=>appendExtension({id:'',name:'',accountId:document.querySelector('.oa [data-field="id"]')?.value||'',password:''});
$('save').onclick=async()=>{try{const response=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json','x-config-password':$('admin').value},body:JSON.stringify(readState())});const data=await response.json();if(!response.ok)throw Error(data.error||'Lưu thất bại');state=data;status('Đã lưu cấu hình và yêu cầu FreeSWITCH reload XML.',true);await load();}catch(error){status(error.message)}};
</script></body></html>
