<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thiết lập SimlyDent Call</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#ebf4ff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:48px 20px;background:radial-gradient(circle at top,#13355c,#07111f 52%)}main{width:min(680px,100%);margin:auto;padding:30px;border:1px solid #29415f;border-radius:20px;background:#0d1b2d;box-shadow:0 24px 80px #0008}h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#9db3cc;line-height:1.55}label{display:block;margin:19px 0 7px;color:#b8cbe0;font-size:13px}input{width:100%;padding:12px;border:1px solid #385471;border-radius:10px;background:#071321;color:#fff;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.check{display:flex;gap:9px;align-items:center;margin-top:16px;color:#b8cbe0;font-size:13px}.check input{width:auto}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#1472ed;color:#fff;font:700 15px inherit;cursor:pointer}button.alt{background:#263b58;margin-top:10px}#message{min-height:22px;margin-top:15px;color:#9db3cc;font-size:13px}.warning{margin-top:20px;padding:12px;border-radius:10px;background:#33280e;color:#f7d878;font-size:13px}@media(max-width:560px){.row{grid-template-columns:1fr}main{padding:22px}}
  </style>
</head>
<body>
  <main>
    <h1>Thiết lập SimlyDent Call</h1>
    <p>Chỉ cần cấu hình một lần trên thiết bị này. Floating Call sẽ tự đăng ký lại mỗi khi mở hệ thống.</p>
    <form id="sip-settings">
      <div class="row">
        <div><label for="extension">Extension</label><input id="extension" autocomplete="username" placeholder="1001" required></div>
        <div><label for="password">Mật khẩu extension</label><input id="password" type="password" autocomplete="current-password" required></div>
      </div>
      <label class="check"><input id="remember-password" type="checkbox" checked> Ghi nhớ mật khẩu trên thiết bị này để tự kết nối</label>
      <button type="submit">Lưu và kết nối</button>
      <button class="alt" id="clear-settings" type="button">Xóa cấu hình trên thiết bị</button>
      <p id="message"></p>
    </form>
    <p class="warning">Mật khẩu chỉ lưu trong trình duyệt của thiết bị này. Không bật lựa chọn ghi nhớ trên máy dùng chung.</p>
    <p style="margin-top:20px"><a href="/" style="color:#83b7ff">← Về Call Center</a></p>
  </main>
  <script type="module" src="/softphone-settings.js"></script>
  <script type="module" src="/floating-softphone.js"></script>
</body>
</html>
